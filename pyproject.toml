[project]
name = "msc-skill-machines"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brendan Griffiths", email = "orwellian225@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "raylib==6.0.1.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
msc-skill-machines = "msc_skill_machines:main"
msc-visualise = "msc_skill_machines.visualiser:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
