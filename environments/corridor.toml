name = "corridor"
step_limit = 50
seed = 7

# (S, A, B) is one cell: initial state carrying labels A and B.
# C has no fixed cells; four are placed at random from the seed.
layout = """
############
#S.A...(S,A,B)..X#
#S....#....#
#S....#..B.#
############
"""

[[labels]]
identifier = "A"
constraint = true
random = false

[[labels]]
identifier = "B"
constraint = false
random = false

[[labels]]
identifier = "C"
constraint = true
random = true
num_states = 4
